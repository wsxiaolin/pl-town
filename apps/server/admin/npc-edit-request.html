<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NPC 编辑申请 · MiniCity</title>
  <link rel="stylesheet" href="/admin/styles.css" />
</head>
<body class="npc-request-page">
  <main class="npc-request-shell">
    <p class="eyebrow">MINICITY · COMMUNITY EDITS</p>
    <h1>申请修改 NPC</h1>
    <p class="npc-request-intro">登录后提交 NPC 资料、设定或对话修改建议，申请会进入开发者审批队列。</p>
    <section class="panel" id="requestLoginPanel">
      <h2>申请者登录</h2><p class="hint">使用小城居民账号登录。新账号密码至少需要 10 个字符。</p>
      <form id="requestLoginForm" class="edit-form"><label>居民昵称<input id="requestLoginNickname" autocomplete="username" maxlength="40" required /></label><label>密码<input id="requestLoginPassword" type="password" autocomplete="current-password" maxlength="128" required /></label><div class="dialog-actions"><button class="primary" type="submit">登录并继续</button></div></form>
      <div class="npc-request-status" id="requestLoginStatus" hidden></div>
    </section>
    <section class="panel" id="requestEditorPanel" hidden>
      <div class="npc-request-userbar"><span id="requestSignedInAs"></span><button class="secondary" id="requestLogout" type="button">退出登录</button></div>
      <h2>新建修改申请</h2>
      <form id="npcRequestForm" class="edit-form"><label>申请类型<select id="requestKind"><option value="edit">修改 NPC 资料</option><option value="dialog">修改 NPC 对话</option><option value="add">申请新增 NPC</option></select></label><label>目标 NPC<select id="requestNpc"><option value="">正在加载 NPC 列表…</option></select></label><label>申请标题<input id="requestTitle" maxlength="120" required /></label><label>详细说明<textarea id="requestSummary" maxlength="2000" required></textarea></label><label>修改内容（可选）<textarea id="requestChange" maxlength="4000"></textarea></label><div class="dialog-actions"><button class="primary" id="requestSubmit" type="submit">提交申请</button></div></form>
      <div class="npc-request-status" id="requestStatus" hidden></div>
    </section>
  </main>
  <script type="module" src="/npc-edit-request.js"></script>
</body>
</html>
