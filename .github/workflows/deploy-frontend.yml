name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure npm network retries
        run: npm config set registry https://registry.npmjs.org/ && npm config set fetch-retries 3 && npm config set fetch-retry-mintimeout 1000 && npm config set fetch-retry-maxtimeout 10000 && npm config set fetch-timeout 120000

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build frontend (web)
        run: npm run build -w @minicity/web
        env:
          BASE_PATH: /pl-town/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
