name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static checks + unit/domain + server tests run on the runner directly; none
  # of them need WebGL, so they stay fast and shard-free.
  verify:
    name: Typecheck, build, unit & server tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Source-size, typecheck, build
        run: npm run typecheck && npm run build

      - name: Unit / domain tests
        run: npm run test:domain

      - name: Server integration tests
        run: npm run test:server

  # The Playwright suite renders a Three.js city with WebGL, which headless
  # Chromium cannot create. We shard the suite across a matrix and run each
  # shard under Xvfb with the SwiftShader software-GL driver (via the shared
  # scripts/run-web-tests.sh wrapper).
  #
  # The suite is small (~30 tests across 4 files), so we keep only 2 shards.
  # Each shard pays a heavy, non-cacheable setup cost (apt for Xvfb + GL libs,
  # plus a ~170MB Chromium download with its apt deps), and GitHub-hosted
  # 2-core runners bottleneck hard on apt/network when several shards do that
  # in parallel — which was making the trailing shard stall for minutes at the
  # install step. Halving the shards halves that redundant setup work and
  # balances the load (the heaviest smoke tests no longer pile onto one shard).
  # Bump total back up only if a shard grows past ~10 min.
  web:
    name: Web (Playwright) shard ${{ matrix.shard }}/${{ matrix.total }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
        total: [2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Xvfb (virtual display) + the Vulkan/SwiftShader software-GL stack that
      # headed Chromium needs to create a WebGL context in a headless runner.
      - name: Install Xvfb + software GL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth \
            libgl1 libegl1 libgles2 mesa-vulkan-drivers \
            fonts-noto-cjk fonts-noto-color-emoji

      - name: Install Playwright Chromium (full build, WebGL-capable)
        run: npx playwright install --with-deps chromium

      - name: Run web test shard under Xvfb
        run: scripts/run-web-tests.sh --shard=${{ matrix.shard }}/${{ matrix.total }}
        env:
          CI: 'true'
          PLAYWRIGHT_WORKERS: '2'
          # Chromium is already installed by the step above; skip the redundant
          # `playwright install --with-deps` (a second apt pass) inside
          # run-web-tests.sh so each shard sets up only once.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Upload shard report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: apps/web/playwright-report
          retention-days: 14

      - name: Upload shard test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: apps/web/test-results
          retention-days: 14
