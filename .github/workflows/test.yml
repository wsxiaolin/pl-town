name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, unit & server tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure npm network retries
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config set fetch-retries 3
          npm config set fetch-retry-mintimeout 1000
          npm config set fetch-retry-maxtimeout 10000
          npm config set fetch-timeout 120000

      - run: npm ci --prefer-offline

      - name: Source-size, typecheck, build
        run: npm run typecheck && npm run build

      - name: Unit / domain tests
        run: npm run test:domain

      - name: Server integration tests
        run: npm run test:server

  web:
    name: Web (Playwright) shard ${{ matrix.shard }}/${{ matrix.total }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # ---------------- 关键：直接使用官方镜像 ----------------
    # 请确认你 package.json 里的 @playwright/test 版本，比如 1.49.0 就写 v1.49.0-noble
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host # 给 Chromium 共享内存，防止 WebGL 复杂场景爆内存崩溃
    # -----------------------------------------------------

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    steps:
      - uses: actions/checkout@v4

      # 容器内自带 Node.js 和已装好的全局 Playwright 浏览器，仅需安装项目依赖
      - name: Install npm dependencies
        run: npm ci --prefer-offline

      # 零安装步骤！Xvfb、WebGL 软解库、浏览器全部出厂自带，直接运行
      - name: Run web test shard under Xvfb
        run: scripts/run-web-tests.sh --shard=${{ matrix.shard }}/${{ matrix.total }}
        env:
          CI: 'true'
          PLAYWRIGHT_WORKERS: '1'
          HOME: /root

      - name: Upload shard report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: apps/web/playwright-report
          retention-days: 14

      - name: Upload shard test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: apps/web/test-results
          retention-days: 14
