name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static checks + unit/domain + server tests run on the runner directly; none
  # of them need WebGL, so they stay fast and shard-free.
  verify:
    name: Typecheck, build, unit & server tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure npm network retries
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config set fetch-retries 3
          npm config set fetch-retry-mintimeout 1000
          npm config set fetch-retry-maxtimeout 10000
          npm config set fetch-timeout 120000

      - run: npm ci --prefer-offline

      - name: Source-size, typecheck, build
        run: npm run typecheck && npm run build

      - name: Unit / domain tests
        run: npm run test:domain

      - name: Server integration tests
        run: npm run test:server

  # The Playwright suite renders a Three.js city with WebGL, which headless
  # Chromium cannot create. We shard the suite across a matrix and run each
  # shard under Xvfb with the SwiftShader software-GL driver.
  web:
    name: Web (Playwright) shard ${{ matrix.shard }}/${{ matrix.total }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure npm network retries
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config set fetch-retries 3
          npm config set fetch-retry-mintimeout 1000
          npm config set fetch-retry-maxtimeout 10000
          npm config set fetch-timeout 120000

      - run: npm ci --prefer-offline

      # 1. 获取准确的 Playwright 版本以命中缓存
      - name: Resolve Playwright version
        id: pw-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test']?.version || 'unknown'")" >> "$GITHUB_OUTPUT"

      # 2. 缓存 Playwright 浏览器二进制包 (~170MB)
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}

      # 3. 安装轻量图形库与 Xvfb（加了超时防卡死参数，换掉了近 1GB 的超大 noto 字体）
      - name: Install Xvfb, GL Stack & System Dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout="15" -qq
          sudo apt-get install -y -qq --no-install-recommends \
            -o Acquire::Retries=3 -o Acquire::http::Timeout="15" \
            xvfb xauth \
            libgl1 libegl1 libgles2 mesa-vulkan-drivers \
            fonts-wqy-zenhei fonts-noto-color-emoji
          npx playwright install-deps chromium

      # 4. 仅在缓存未命中时才下载浏览器二进制包
      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # 5. 运行测试（将 Worker 锁定为 1，避免 2 核 CPU 跑 WebGL 软解发生线程争抢死锁）
      - name: Run web test shard under Xvfb
        run: scripts/run-web-tests.sh --shard=${{ matrix.shard }}/${{ matrix.total }}
        env:
          CI: 'true'
          PLAYWRIGHT_WORKERS: '1'

      - name: Upload shard report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: apps/web/playwright-report
          retention-days: 14

      - name: Upload shard test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: apps/web/test-results
          retention-days: 14
