name: Auto-Fix (Issue -> PR)

# 移植自 NetLogo-Mobile/plweb2 的 opencode-cli.yml。
# 当 Issue 被打上 `autofix` 标签时，自动驱动 AI 代理按 AGENTS.md 约定修改代码、
# 运行校验、生成结论文件，并创建分支与 Pull Request。
on:
  issues:
    types: [labeled] # 创建时勾选 autofix 会同时触发 opened 和 labeled，只保留 labeled 以避免重复执行

permissions:
  contents: write # 创建分支并推送代码
  pull-requests: write # 创建 PR
  issues: write # 关联 / 管理 Issue

jobs:
  issue-agent-coding:
    # 仅处理真正的 Issue（PR 也是 Issue 的一种，打标签时也会触发 issues 事件）
    if: github.event.label.name == 'autofix' && github.event.issue.pull_request == null
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 不把写权限凭据留在 .git/config，AI 代理运行期间无法直接 push；
          # 推送所需的鉴权在最后的建分支步骤中通过 gh auth setup-git 重新注入
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: |
          # pl-town 是 npm workspace（apps/web + apps/server），根目录有 package-lock.json
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Install OpenCode CLI
        run: npm install -g opencode-ai

      - name: Install skills
        run: |
          # skills-lock.json 拉取 plweb-skill（Physics Lab 社区 API 文档）与 code-review 技能
          npx skills update

      # 使用环境变量安全地注入 Issue 内容，避免 shell 注入 / 转义问题
      - name: Prepare prompt from issue
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          echo "### Issue Title: $ISSUE_TITLE" > issue_prompt.txt
          echo "### Issue Description:" >> issue_prompt.txt
          echo "$ISSUE_BODY" >> issue_prompt.txt
          echo "" >> issue_prompt.txt

          cat << 'EOF' >> issue_prompt.txt

          【Mandatory Requirements】:
          1. Read `Agents.md` first and follow its module boundaries, dependency direction,
             source-size limits (普通逻辑文件 ≤ 1000 行，MiniCityApp.ts ≤ 2000 行) and
             3D rendering z-fighting guidance. Do not refactor unrelated code.
          2. Develop or fix the codebase according to the Issue description above.
             - 前端：Vite + TypeScript + Three.js，入口 `apps/web/src/main.ts`。
             - 服务端：Node.js + TypeScript HTTP/WebSocket，入口 `apps/server/src/index.ts`。
             - 涉及 Physics Lab 社区 API 时，参考 plweb-skill 技能文档。
          3. After completing the changes, you MUST create a Markdown file named
             `conclusion.md` in the repository root.
          4. In `conclusion.md`, describe (strictly in English) which files you modified,
             what changes you made, the technical solutions used, and the final summary.
          5. After coding, run validation matching the change scope:
             - always: `npm run typecheck` and `npm run build`
             - domain logic: `npm run test:domain`
             - server protocol/persistence: `npm run test:server`
             - only for browser interaction / layout / WebGL / E2E: `npm run test:web`
             (If Chromium cannot start, record it in conclusion.md instead of failing.)
          6. Reflect on the code-review skill output and adjust your code accordingly.
          7. Do NOT git commit, git push, or create PRs yourself — the workflow does that.
          EOF

      - name: Run OpenCode coding agent
        run: |
          # 代理运行期间移除写权限令牌，避免模型自行 push / 开 PR；鉴权仅在建分支步骤重新注入
          unset GITHUB_TOKEN GH_TOKEN
          PROMPT=$(cat issue_prompt.txt)
          opencode run \
            --model opencode/deepseek-v4-flash-free \
            --variant high \
            --dangerously-skip-permissions \
            "$PROMPT"

      - name: Create branch and pull request with AI conclusion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          rm -f issue_prompt.txt

          # skills update 可能改写 skills-lock.json 的 computedHash，恢复以免混入 PR
          git checkout -- skills-lock.json 2>/dev/null || true

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes detected, assembling Pull Request description..."

            # 写到 /tmp，避免临时文件被 git add . 混入提交
            PR_BODY="/tmp/pr_body.txt"
            echo "### AI: Resolves #$ISSUE_NUMBER" > "$PR_BODY"
            echo "" >> "$PR_BODY"
            echo "This Pull Request was automatically generated by the Auto-Fix workflow to address Issue #$ISSUE_NUMBER." >> "$PR_BODY"
            echo "" >> "$PR_BODY"

            if [ -f "conclusion.md" ]; then
              echo "### 📝 AI Modification Summary & Conclusion:" >> "$PR_BODY"
              cat conclusion.md >> "$PR_BODY"
              rm -f conclusion.md
            else
              echo "### ⚠️ Warning:" >> "$PR_BODY"
              echo "AI Agent completed the coding task but failed to generate the required 'conclusion.md' file." >> "$PR_BODY"
            fi

            echo "" >> "$PR_BODY"
            echo "_This PR was created by an AI agent (Auto-Fix workflow) on behalf of the maintainer._" >> "$PR_BODY"

            BRANCH_NAME="autofix/issue-$ISSUE_NUMBER-${{ github.run_id }}"
            git checkout -b "$BRANCH_NAME"
            git add .
            git commit -m "Auto-fix: Resolve Issue #$ISSUE_NUMBER"

            # persist-credentials: false 下，这里用 GITHUB_TOKEN 重新配置推送鉴权
            gh auth setup-git
            git push origin "$BRANCH_NAME"

            gh pr create \
              --title "auto-fix: $ISSUE_TITLE (Resolves #$ISSUE_NUMBER)" \
              --body-file "$PR_BODY" \
              --head "$BRANCH_NAME" \
              --base "${{ github.event.repository.default_branch }}"

            rm -f "$PR_BODY"
          else
            echo "No changes made by the Auto-Fix agent."
            # 在 Issue 上说明未开 PR 的原因，避免静默失败
            {
              echo "The Auto-Fix agent ran for this issue but made no code changes, so no pull request was opened."
              echo "Review the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
              echo ""
              echo "_This comment was generated by an AI agent (Auto-Fix workflow) on behalf of the maintainer._"
            } > /tmp/no_changes_comment.md
            gh issue comment "$ISSUE_NUMBER" --body-file /tmp/no_changes_comment.md
            rm -f /tmp/no_changes_comment.md
          fi
