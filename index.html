<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>物实小城 — MiniCity</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="day">

  <canvas id="c"></canvas>
  <div class="labels-wrap" id="labelsWrap"></div>

  <!-- UI Chrome -->
  <header class="ui-header">
    <div class="logo">
      <span class="logo-dot"></span>
      <span class="logo-name">物实小城</span>
      <span class="logo-user" id="logoUser"></span>
    </div>
    <nav class="ui-nav">
      <button class="map-toggle fs-toggle" id="fsToggle" type="button">全屏</button>
      <button class="map-toggle" id="mapToggle" type="button">地图</button>
      <div class="time-display" id="communityTime" title="社区时间（现实 1 分钟 = 游戏 1 小时）">09:00</div>
    </nav>
  </header>

  <div class="welcome-block">
    <p class="welcome-main">welcome.<br>explore the city.</p>
    <p class="welcome-sub">click on a building to explore.</p>
    <div class="welcome-accent"></div>
  </div>

  <div class="you-block">
    <div class="you-person">
      <div class="yp-head"></div>
      <div class="yp-body"></div>
    </div>
    <div class="you-text">
      <span class="you-label">YOU ARE HERE</span>
      <span class="you-sub">click a road to walk</span>
    </div>
  </div>

  <!-- City map paper -->
  <div class="map-overlay" id="mapOverlay" role="dialog" aria-label="全景地图">
    <div class="map-paper">
      <button class="map-close" id="mapClose" type="button" aria-label="关闭地图">✕</button>
      <h2 class="map-title">物实小城 · 全景地图</h2>
      <div class="map-image-wrap" id="mapImageWrap">
        <img id="mapImage" alt="物实小城全景地图" />
        <div class="map-icons" id="mapIcons"></div>
        <span class="map-marker" id="mapMarker" aria-label="当前位置"></span>
        <div class="map-tip" id="mapTip">
          <button class="mt-close" id="mapTipClose" type="button" aria-label="关闭介绍">✕</button>
          <h3 class="mt-title" id="mapTipTitle"></h3>
          <p class="mt-slogan" id="mapTipSlogan"></p>
          <div class="mt-actions">
            <button class="mt-tele" id="mapTipTele" type="button">传送</button>
            <span class="mt-lock" id="mapTipLock">步行 100 米解锁传送</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Population filter -->
  <div class="pop-filter" id="popFilter">
    <span class="pf-label">CITIZENS</span>
    <button class="pf-btn" data-filter="bots">Bots</button>
    <button class="pf-btn" data-filter="friends">Friends</button>
    <button class="pf-btn active" data-filter="all">All</button>
  </div>

  <!-- Unlock toast -->
  <div class="unlock-toast" id="unlockToast" aria-live="polite">
    <span class="ut-dot"></span>
    <span class="ut-text" id="utText">area unlocked</span>
  </div>

  <!-- Stats panel (right drawer) -->
  <div class="stats-panel" id="statsPanel" role="dialog" aria-label="City Stats">
    <div class="sp-head">
      <span class="sp-title">CITY STATS</span>
      <div class="sp-modes">
        <button class="sp-mode active" id="spModeClean">Overview</button>
        <button class="sp-mode" id="spModeRaw">Raw</button>
      </div>
      <button class="sp-close" id="spClose" aria-label="Close stats panel">✕</button>
    </div>
    <div class="sp-body" id="spBody"></div>
  </div>

  <!-- Login overlay -->
  <div class="login-overlay hidden" id="loginOverlay" role="dialog" aria-label="Welcome to MiniCity" style="display:none">
    <div class="login-box">
      <span class="login-dot"></span>
      <p class="login-title">边界已经开启。</p>
      <p class="login-sub">留下你的名字，成为这座城的居民。</p>
      <input class="login-input" id="loginInput" type="text" placeholder="你的名字"
             maxlength="20" autocomplete="off" spellcheck="false" />
      <button class="login-btn" id="loginBtn">签下名字，进入小城</button>
    </div>
  </div>

  <!-- CG Animation overlay -->
  <div class="cg-overlay" id="cgOverlay" style="display:none">
    <div class="cg-scene-wrap" id="cgSceneWrap"></div>
    <button class="cg-skip" id="cgSkip">跳过 ›</button>
  </div>

  <!-- Building Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-paper" id="modalPaper">
      <div class="modal-header">
        <span class="modal-num" id="modalNum"></span>
        <h2 class="modal-title" id="modalTitle"></h2>
      </div>
      <p class="modal-slogan" id="modalSlogan"></p>
      <div class="modal-divider"></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <button class="modal-close" id="modalClose">合上</button>
      </div>
    </div>
  </div>

  <!-- NPC Dialog -->
  <div class="npc-overlay" id="npcOverlay">
    <div class="npc-panel">
      <div class="npc-head">
        <span class="npc-avatar" id="npcAvatar"></span>
        <div class="npc-id">
          <h3 class="npc-name" id="npcName"></h3>
          <span class="npc-role" id="npcRole"></span>
        </div>
        <button class="npc-close" id="npcClose" aria-label="结束对话">✕</button>
      </div>
      <div class="npc-body">
        <p class="npc-line" id="npcLine"></p>
      </div>
      <div class="npc-options" id="npcOptions"></div>
    </div>
  </div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
